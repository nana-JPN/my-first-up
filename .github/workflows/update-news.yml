name: Update news dashboard

on:
  schedule:
    # 15 分ごと。GitHub の定期実行は混雑時に遅延・スキップされることがあり、
    # 特に毎時 0 分・30 分は混みやすいので、半端な分を指定している
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:          # Actions タブから手動実行も可能
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds
        run: python scripts/fetch_news.py site/news.json
        env:
          NEWS_CACHE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/news.json

      - name: Stamp build id
        run: sed -i "s/__BUILD__/${GITHUB_SHA}/" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 公開はまれに GitHub 側の一時的な不具合 (アップロード直後に成果物が見つからない) で
      # 失敗するので、30 秒待って 1 回だけやり直す
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
