name: Update news dashboard

on:
  schedule:
    # 15 分ごと。GitHub の定期実行は混雑時に遅延・スキップされることがあり、
    # 特に毎時 0 分・30 分は混みやすいので、半端な分を指定している
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:          # Actions タブから手動実行も可能
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds
        run: python scripts/fetch_news.py site/news.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
